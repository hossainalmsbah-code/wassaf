<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصف منتج بواسطة وصّاف</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B2E;--ink-dim:#6B6785;--bg:#FFFFFF;--bg-raised:#F7F6FB;
    --line:#E7E4F0;--accent:#E94548;--accent-dim:#FCEAEA;--accent2:#6E5BC7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.9;}
  .wrap{max-width:640px;margin:0 auto;padding:64px 24px 60px;}
  .logo{text-align:center;margin-bottom:40px;}
  .logo img{height:38px;width:auto;}
  .product-name{font-family:'Tajawal',sans-serif;font-weight:800;font-size:20px;margin-bottom:16px;}
  .card{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px;white-space:pre-wrap;font-size:15px;}
  .label{font-size:12px;color:var(--accent2);font-weight:700;margin-bottom:10px;}
  .footer-note{text-align:center;color:var(--ink);font-size:19px;font-weight:800;margin-top:32px;font-family:'Tajawal',sans-serif;}
  .cta{
    display:block;text-align:center;margin-top:16px;background:var(--accent);color:#1a0e14;
    text-decoration:none;font-size:16px;font-weight:700;padding:16px;border-radius:8px;
  }
  .cta:hover{background:#ff8095;}
  .loading, .notfound{text-align:center;color:var(--ink-dim);padding:60px 20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="/assets/logo-horizontal.svg" alt="وصّاف"></div>
  <div id="content">
    <div class="loading">جاري تحميل الوصف...</div>
  </div>
</div>

<script>
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadShare(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const content = document.getElementById('content');
  if(!id){
    content.innerHTML = '<div class="notfound">رابط غير صحيح</div>';
    return;
  }
  try{
    const res = await fetch('/api/growth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'get_share', id })
    });
    const data = await res.json();
    if(!res.ok || !data.ok){
      content.innerHTML = '<div class="notfound">هذا الرابط منتهي أو غير موجود</div>';
      return;
    }
    let html = '';
    if(data.productName){
      html += `<div class="product-name">${escapeHTML(data.productName)}</div>`;
    }
    if(data.long){
      html += `<div class="label">الوصف</div><div class="card">${escapeHTML(data.long)}</div>`;
    }
    if(data.short){
      html += `<div class="label">نسخة قصيرة</div><div class="card">${escapeHTML(data.short)}</div>`;
    }
    if(data.seo){
      html += `<div class="label">وصف SEO</div><div class="card">${escapeHTML(data.seo)}</div>`;
    }
    html += `<div class="footer-note">تم إنشاء هذا الوصف بواسطة وصّاف</div>`;
    html += `<div style="text-align:center;margin-top:8px;">
      <a href="#" id="contactLink" style="color:var(--ink-dim);font-size:12px;text-decoration:none;">تواصل معنا</a>
      <div id="contactBox" style="display:none;margin-top:8px;font-size:12px;color:var(--ink-dim);">
        <span style="font-family:monospace;">wassaf.sa@gmail.com</span>
        <button type="button" id="contactCopyBtn" style="margin-right:8px;background:none;border:1px solid var(--line);color:var(--ink-dim);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;">نسخ</button>
      </div>
    </div>`;
    html += `<a class="cta" href="https://www.wassaf.space/">جرّب مجاناً</a>`;
    content.innerHTML = html;

    const contactLink = document.getElementById('contactLink');
    const contactBox = document.getElementById('contactBox');
    if(contactLink && contactBox){
      contactLink.addEventListener('click', (e) => {
        e.preventDefault();
        contactBox.style.display = contactBox.style.display === 'none' ? 'block' : 'none';
      });
      const contactCopyBtn = document.getElementById('contactCopyBtn');
      contactCopyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText('wassaf.sa@gmail.com');
        const old = contactCopyBtn.textContent;
        contactCopyBtn.textContent = 'تم ✓';
        setTimeout(() => contactCopyBtn.textContent = old, 1500);
      });
    }
  }catch(e){
    content.innerHTML = '<div class="notfound">صار خطأ أثناء تحميل الوصف</div>';
  }
}
loadShare();
</script>
</body>
</html>
